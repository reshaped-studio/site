name: Build and deploy to GitHub Pages

# Deploy is manual until the agency site is ready to publish.
# The Eleventy project in this repo is the pre-agency landing page.
#
# Assumptions:
# - Pages is enabled in the repo settings with source = "GitHub Actions".
# - PATH_PREFIX is "/" for reshaped.studio. Use "/site/" only for a
#   project-page deploy at github.io/site/.

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time. New pushes cancel in-flight runs of older commits.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Build site
        env:
          PATH_PREFIX: "/"
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
